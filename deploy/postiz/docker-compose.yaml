# Postiz on the Oracle Always Free VM (or any Docker host). Based on gitroomhq/postiz-docker-compose.
# Before `docker compose up -d`: copy .env.example → .env and fill it; compose down before any env change.
services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.30.0   # PIN the tag; bump deliberately after testing unlisted
    container_name: postiz
    restart: always
    env_file: .env
    environment:
      MAIN_URL: "https://${DOMAIN}"
      FRONTEND_URL: "https://${DOMAIN}"
      NEXT_PUBLIC_BACKEND_URL: "https://${DOMAIN}/api"
      DATABASE_URL: "postgresql://postiz:${POSTGRES_PASSWORD}@postiz-postgres:5432/postiz"
      REDIS_URL: "redis://postiz-redis:6379"
      TEMPORAL_ADDRESS: "postiz-temporal:7233"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"        # set true after you and Tom have accounts
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postiz-postgres: { condition: service_healthy }
      postiz-redis: { condition: service_healthy }
      postiz-temporal: { condition: service_started }

  postiz-postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postiz
      POSTGRES_DB: postiz
    volumes: [postgres-volume:/var/lib/postgresql/data]
    healthcheck:
      test: pg_isready -U postiz -d postiz
      interval: 10s
      timeout: 3s
      retries: 3

  postiz-redis:
    image: redis:7.2
    restart: always
    volumes: [postiz-redis-data:/data]
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3

  postiz-temporal:
    image: temporalio/auto-setup:1.25
    restart: always
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postiz
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postiz-postgres
    depends_on:
      postiz-postgres: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-volume:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:
  caddy-data:
  caddy-config:
